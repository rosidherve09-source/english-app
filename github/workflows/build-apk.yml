name: Construire l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparer le dossier web
        run: |
          mkdir -p www
          cp index.html www/index.html
      - name: Installer les dependances
        run: npm install
      - name: Creer le projet Android
        run: npx cap add android
      - name: Autoriser le micro
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Copier l'appli dans Android
        run: npx cap sync android
      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: english-hors-ligne-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
